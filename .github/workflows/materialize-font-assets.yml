name: Materialize uploaded font assets

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/use-determination-fonts'
    runs-on: ubuntu-latest
    steps:
      - name: Check out font branch
        uses: actions/checkout@v4
        with:
          ref: agent/use-determination-fonts
          fetch-depth: 0

      - name: Decode and commit real assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.font-assets.part-*)
          if (( ${#parts[@]} != 4 )); then
            echo "Waiting for all four font payload chunks; found ${#parts[@]}."
            exit 0
          fi

          cat "${parts[@]}" | base64 --decode > /tmp/font-assets.tar.gz
          tar -xzf /tmp/font-assets.tar.gz

          test -f assets/fonts/DeterminationMonoWebRegular-Z5oq.ttf
          test -f assets/fonts/DeterminationSansWebRegular-369X.ttf
          test -f assets/fonts/DETERMINATION-FONT-NOTICE.txt
          test -f assets/ui/title-logo.png
          file assets/fonts/*.ttf assets/ui/title-logo.png

          rm -f .font-assets.tar.gz.b64 .font-assets.part-*
          rm -f .github/workflows/materialize-font-assets.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Determination font assets"
          git push origin HEAD:agent/use-determination-fonts
